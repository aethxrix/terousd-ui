name: Question
description: Ask how to do something with Terousd UI
title: "[Question]: "
labels: ["question"]

body:
  - type: markdown
    attributes:
      value: |
        Before opening a question, please:

        - Read the Terousd UI README and project documentation.
        - Search [existing issues](../issues?q=is%3Aissue) - the question
          may already have been asked.

        Use this template only when you have a usage question that the docs
        and previous issues don't answer. If you found something **broken**,
        open a Bug report instead.

  - type: textarea
    id: question
    attributes:
      label: What are you trying to do?
      description: Describe the goal, not just the symptom. The clearer the goal, the better the answer.
      placeholder: |
        I'm trying to ... so that ...
        I expected the panel to ... but I'm not sure how to configure it.
    validations:
      required: true

  - type: textarea
    id: tried
    attributes:
      label: What have you already tried?
      description: Documentation you read, settings you toggled, commands you ran.
      placeholder: |
        - Read the reverse proxy notes
        - Tried setting `xrayBasePath` to `/proxy` - got 404
    validations:
      required: false

  - type: input
    id: xui-version
    attributes:
      label: Terousd UI version
      description: Shown at the top of the panel sidebar.
      placeholder: 3.2.4
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: How did you install Terousd UI?
      options:
        - install.sh script
        - Docker / Docker Compose
        - Manual build from source
        - Other
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Ubuntu 24.04 / Debian 12 / CentOS Stream 9 ...
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or config snippets
      description: Drag images or paste relevant config. Redact tokens, real domains, client UUIDs.
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Before submitting
      options:
        - label: I read the Terousd UI documentation and searched [existing issues](../issues?q=is%3Aissue).
          required: true
        - label: This is a usage question, not a bug report.
          required: true
        - label: This question is written in English.
          required: true
